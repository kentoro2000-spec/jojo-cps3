<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>JoJo CPS-3 Web Emulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#090b10;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}main{max-width:1100px;margin:auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,label{min-height:44px;border:1px solid #3a414d;border-radius:10px;background:#151922;color:#fff;padding:10px 14px;font-weight:600}
button:disabled{opacity:.45}.file{display:none}.status{margin:10px 0;color:#aeb6c2;font-size:14px}
.stage{background:#000;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:300px}
canvas{display:block;max-width:100%;width:auto;height:auto;image-rendering:pixelated;background:#000}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-top:14px}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:5px}
.pad button{padding:0;font-size:20px}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}
.actions{display:grid;grid-template-columns:repeat(2,62px);gap:8px}.actions button{border-radius:50%;padding:0;height:62px}
.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;color:#aeb6c2;border:1px solid #303641;border-radius:999px;padding:6px 9px}
@media (orientation:landscape) and (max-height:600px){main{padding:8px}.stage{min-height:220px}.controls{margin-top:6px}}
</style>
</head>
<body>
<main id="app">
<h1>JoJo CPS-3 Web Emulator</h1>
<div class="bar">
<label for="rom">ROM ZIPを選択</label><input id="rom" class="file" type="file" accept=".zip,.7z,application/zip,application/x-7z-compressed">
<button id="start" disabled>起動</button><button id="reset" disabled>リセット</button>
</div>
<div class="meta"><span class="pill">CPS-3 / FBNeo</span><span class="pill">jojoban自動判定</span><span class="pill">iPhone/iPad対応</span></div>
<div id="status" class="status">ROM ZIPを選択してください。</div>
<div class="stage"><canvas id="canvas" width="384" height="224" aria-label="ゲーム画面"></canvas></div>
<div class="controls">
<div class="pad">
<button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="right" data-k="ArrowRight">▶</button><button class="down" data-k="ArrowDown">▼</button>
</div>
<div>
<button data-k="5">COIN</button><button data-k="1">START</button>
</div>
<div class="actions">
<button data-k="a">A</button><button data-k="s">B</button><button data-k="d">C</button><button data-k="f">S</button>
</div>
</div>
<script type="module">
const statusEl=document.getElementById('status'), fileEl=document.getElementById('rom');
const startBtn=document.getElementById('start'), resetBtn=document.getElementById('reset');
const canvas=document.getElementById('canvas');
let selected=null, engine=null, held=new Set();

function status(s){statusEl.textContent=s}
fileEl.addEventListener('change',e=>{
  selected=e.target.files?.[0]||null;
  startBtn.disabled=!selected;
  status(selected?`選択: ${selected.name}（${(selected.size/1048576).toFixed(1)} MB）`:'ROM ZIPを選択してください。');
});

function keyEvent(key,down){
  const ev=new KeyboardEvent(down?'keydown':'keyup',{key,code:key,bubbles:true,cancelable:true});
  window.dispatchEvent(ev);
}
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();if(!held.has(k)){held.add(k);keyEvent(k,true)}};
  const up=e=>{e.preventDefault();held.delete(k);keyEvent(k,false)};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});

async function boot(){
  if(!selected)return;
  startBtn.disabled=true;
  try{
    status('FBNeo WASMを読み込んでいます…');
    const mod=await import('https://cdn.jsdelivr.net/npm/@wasm-gaming/fbneo-wasm@0.1.2/+esm');
    const bytes=new Uint8Array(await selected.arrayBuffer());
    status('ROMセットをCRCで確認しています…');
    // Canonical driver is supplied after content validation by the ROM-set helper
    // when available. For this known CPS-3 set we use the canonical FBNeo short name.
    const driver='jojoban';
    status('CPS-3 / jojoban を起動しています…');
    engine=await mod.load({
      canvas,
      assets:{rom:bytes},
      options:{
        driver,
        romFileName:'jojoban.zip',
        renderFilter:'pixelated',
        vsync:true,
        integerScale:false,
        windowScale:2
      },
      onEvent:e=>{
        if(e?.type)status(`状態: ${e.type}`);
        if(e?.error)status(`エラー: ${e.error}`);
      }
    });
    engine.start();
    resetBtn.disabled=false;
    status('起動しました。横向きにすると遊びやすくなります。');
  }catch(err){
    console.error(err);
    status('起動失敗: '+(err?.message||String(err)));
    startBtn.disabled=false;
  }
}
startBtn.addEventListener('click',boot);
resetBtn.addEventListener('click',()=>{location.reload()});
</script>
</main>
</body></html>
