<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>JoJo CPS-3 Browser Emulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1000px;margin:auto;padding:14px}
h1{font-size:20px}
p{color:#c5ccd6;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,label{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:1px solid #3a414d;border-radius:10px;background:#151922;color:#fff;font-weight:600}
button:disabled{opacity:.45}
input[type=file]{max-width:100%;color:#dfe5ed}
#status{margin:12px 0;color:#b9c4d2;font-size:14px}
#game-wrap{width:100%;min-height:280px;background:#000;border-radius:12px;overflow:hidden}
#game{width:100%;min-height:280px;aspect-ratio:4/3}
.note{font-size:13px;color:#9da8b7}
</style>
</head>
<body>
<main>
<h1>JoJo CPS-3 Web Emulator</h1>
<p>ROM ZIPを選択して「起動」を押してください。ROMはブラウザ内で読み込みます。</p>
<div class="row">
<input id="rom" type="file" accept=".zip,.7z,application/zip,application/x-7z-compressed" aria-label="ROM ZIPを選択">
<button id="start" type="button" disabled>起動</button>
<button id="reset" type="button" disabled>リセット</button>
</div>
<div id="status" role="status" aria-live="polite">ROM ZIPを選択してください。</div>
<div id="game-wrap"><div id="game"></div></div>
<p class="note">注意：このページはEmulatorJSの公開CDNを利用します。ROMセットのバージョンが対応していない場合や、ブラウザの制限がある場合は起動しないことがあります。</p>
</main>
<script>
(() => {
  const fileInput = document.getElementById('rom');
  const startButton = document.getElementById('start');
  const resetButton = document.getElementById('reset');
  const status = document.getElementById('status');
  let gameUrl = null;
  let loaderAdded = false;
  let started = false;

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    startButton.disabled = !file;
    status.textContent = file
      ? `選択: ${file.name}（${(file.size / 1048576).toFixed(1)} MB）`
      : 'ROM ZIPを選択してください。';
  });

  startButton.addEventListener('click', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file || started) return;
    if (gameUrl) URL.revokeObjectURL(gameUrl);
    gameUrl = URL.createObjectURL(file);
    started = true;
    startButton.disabled = true;
    resetButton.disabled = false;
    status.textContent = 'EmulatorJSを読み込んでいます…';

    window.EJS_player = '#game';
    window.EJS_core = 'arcade';
    window.EJS_gameUrl = gameUrl;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_language = 4;
    window.EJS_gameName = 'JoJo CPS-3';

    const loader = document.createElement('script');
    loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    loader.async = true;
    loader.onload = () => {
      status.textContent = 'ローダーを読み込みました。ゲームの起動を待っています…';
    };
    loader.onerror = () => {
      status.textContent = 'エラー：EmulatorJSのローダーを読み込めません。通信制限やCDN障害の可能性があります。';
      started = false;
      startButton.disabled = false;
    };
    loaderAdded = true;
    document.body.appendChild(loader);
  });

  resetButton.addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
